<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211913"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="VINA"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><title>VINA Data Centre</title><link rel="stylesheet" href="/style.css?v=20261109-layout-restore-1"><link rel="stylesheet" href="/responsive.css?v=20261109-inventory-sync-6"></head><body><div id="vina-splash" class="vina-splash" role="status" aria-live="polite" aria-label="Завантаження VINA"><div class="vina-splash-inner"><img src="/vina-logo.svg" alt="VINA" width="190" height="98"><div class="vina-splash-line" aria-hidden="true"><span></span></div><p>Готуємо ваш простір</p></div></div><div class="shell"><aside class="sidebar"><div class="logo"><img src="/vina-logo.svg" alt="VINA" width="170" height="89"></div><div class="subtitle">DATA CENTRE</div><nav><button class="active" type="button">◫ &nbsp; Панель керування</button></nav><div class="sidebar-bottom">VINA Data Centre<br><small>Захищена серверна авторизація</small></div></aside><main><header><div><div class="eyebrow">VINA / УПРАВЛІННЯ</div><h1 id="page-title">Вітаємо у VINA</h1><p id="page-subtitle">Завантаження системи…</p></div><div class="header-right"><button class="ghost" id="logout" hidden>Вийти</button></div></header><div id="notice" class="notice" role="status" hidden></div><section id="content" aria-live="polite"></section></main></div><script>
(function(){
  var splash=document.getElementById('vina-splash');
  var cleared=false;
  function reveal(){
    if(cleared||!splash)return;
    cleared=true;
    splash.style.setProperty('opacity','0','important');
    splash.style.setProperty('pointer-events','none','important');
    splash.style.setProperty('visibility','hidden','important');
    splash.setAttribute('aria-hidden','true');
    window.setTimeout(function(){if(splash.parentNode)splash.parentNode.removeChild(splash)},400);
  }
  window.setTimeout(reveal,6000);
  window.addEventListener('error',function(e){
    if(e.filename&&e.filename.indexOf('/app.js')!==-1){
      reveal();
      var notice=document.getElementById('notice');
      if(notice){notice.hidden=false;notice.textContent='Помилка запуску інтерфейсу. Оновіть сторінку або повідомте адміністратору.'}
    }
  });
  window.addEventListener('unhandledrejection',function(){window.setTimeout(reveal,300)});
})();
</script><script src="/app.js?v=20261109-inventory-sync-6"></script></body></html>
